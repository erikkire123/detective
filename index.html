<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Logger</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0d0f12;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 25px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      background: #15181d;
      border: 1px solid #292e36;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 11px;
      margin: 5px 0;
      border-radius: 7px;
      border: 1px solid #343a44;
      background: #0f1216;
      color: white;
      font-size: 14px;
    }

    button {
      background: #5865f2;
      border-color: #5865f2;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    button.secondary {
      background: #242932;
      border-color: #343a44;
    }

    button.danger {
      background: #8e3030;
      border-color: #8e3030;
      width: auto;
      padding: 8px 12px;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row > * {
      flex: 1;
    }

    .person,
    .event {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #292e36;
    }

    .person:last-child,
    .event:last-child {
      border-bottom: none;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      background: #5865f2;
      display: grid;
      place-items: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .name {
      font-weight: bold;
      margin-bottom: 3px;
    }

    .small {
      color: #888;
      font-size: 12px;
      word-break: break-all;
    }

    .pill {
      background: #242932;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 11px;
      white-space: nowrap;
    }

    .empty {
      color: #777;
      padding: 15px 0;
    }

    .loading {
      color: #aaa;
      font-size: 12px;
      margin-top: 5px;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .row {
        flex-direction: column;
        gap: 0;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Event Logger</h1>
  <div class="subtitle">
    Simple personnel and event tracker
  </div>

  <div class="grid">

    <!-- PERSONNEL -->
    <section class="card">
      <h2>Add Personnel</h2>

      <input
        id="discordId"
        placeholder="Discord ID"
        autocomplete="off"
      >

      <input
        id="rank"
        placeholder="Rank (optional)"
      >

      <button onclick="addPerson()">
        Add Person
      </button>

      <div id="addStatus"></div>

      <div id="people"></div>
    </section>


    <!-- EVENTS -->
    <section class="card">
      <h2>Log Event</h2>

      <input
        id="eventName"
        placeholder="Event name"
      >

      <div class="row">

        <select id="personSelect">
          <option value="">No personnel</option>
        </select>

        <select id="role">
          <option value="attendee">Attendee</option>
          <option value="cohost">Co-Host</option>
          <option value="host">Host</option>
        </select>

      </div>

      <button onclick="logEvent()">
        Log Attendance
      </button>

      <div id="events"></div>
    </section>

  </div>


  <!-- LEADERBOARD -->
  <section class="card">

    <h2>Leaderboard</h2>

    <div id="leaderboard"></div>

    <button
      class="secondary"
      onclick="clearAll()"
    >
      Clear All Local Data
    </button>

  </section>

</div>


<script>

/* =========================================================
   LOCAL STORAGE
========================================================= */

const STORAGE_KEY = "simple_event_logger_v2";

let state = JSON.parse(
  localStorage.getItem(STORAGE_KEY) ||
  '{"people":[],"events":[]}'
);


/* =========================================================
   SAVE
========================================================= */

function save() {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

  render();
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value) {

  return String(value ?? "").replace(
    /[&<>"']/g,

    char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char])
  );

}


/* =========================================================
   INITIALS
========================================================= */

function initials(name) {

  if (!name) {
    return "?";
  }

  return name
    .split(/\s+/)
    .map(x => x[0])
    .join("")
    .slice(0, 2)
    .toUpperCase();

}


/* =========================================================
   DISCORD API
=========================================================

   This calls your Vercel API route:

   /api/discord/DISCORD_ID

   Your bot token NEVER goes in this file.
========================================================= */

async function getDiscordUser(discordId) {

  const response = await fetch(
    "/api/discord/" +
    encodeURIComponent(discordId)
  );

  if (!response.ok) {

    throw new Error(
      "Discord user could not be found."
    );

  }

  return await response.json();

}


/* =========================================================
   ADD PERSON
========================================================= */

async function addPerson() {

  const discordId =
    document
      .getElementById("discordId")
      .value
      .trim();

  const rank =
    document
      .getElementById("rank")
      .value
      .trim();

  const status =
    document.getElementById("addStatus");


  if (!/^\d{17,20}$/.test(discordId)) {

    alert(
      "Enter a valid Discord ID."
    );

    return;

  }


  if (
    state.people.some(
      person => person.id === discordId
    )
  ) {

    alert(
      "That person is already added."
    );

    return;

  }


  status.innerHTML =
    '<div class="loading">Fetching Discord profile...</div>';


  try {

    const discordUser =
      await getDiscordUser(discordId);


    const person = {

      id: discordUser.id,

      username:
        discordUser.username || "",

      name:
        discordUser.global_name ||
        discordUser.username ||
        "Discord User",

      avatar:
        discordUser.avatar_url || null,

      rank: rank

    };


    state.people.push(person);


    document.getElementById(
      "discordId"
    ).value = "";

    document.getElementById(
      "rank"
    ).value = "";

    status.innerHTML = "";


    save();


  } catch (error) {

    console.error(error);

    status.innerHTML =
      '<div class="loading">Discord lookup failed.</div>';

    alert(
      "Could not fetch that Discord user. Check the ID and make sure your Vercel API is configured correctly."
    );

  }

}


/* =========================================================
   REFRESH DISCORD PROFILE
========================================================= */

async function refreshPerson(discordId) {

  try {

    const discordUser =
      await getDiscordUser(discordId);


    const person =
      state.people.find(
        p => p.id === discordId
      );


    if (!person) {
      return;
    }


    person.username =
      discordUser.username || "";

    person.name =
      discordUser.global_name ||
      discordUser.username ||
      "Discord User";

    person.avatar =
      discordUser.avatar_url || null;


    save();


  } catch (error) {

    console.log(
      "Discord refresh failed:",
      error
    );

  }

}


/* =========================================================
   LOG EVENT
========================================================= */

function logEvent() {

  const eventName =
    document
      .getElementById("eventName")
      .value
      .trim();

  const personId =
    document
      .getElementById("personSelect")
      .value;

  const role =
    document
      .getElementById("role")
      .value;


  if (!eventName) {

    alert(
      "Enter an event name."
    );

    return;

  }


  if (!personId) {

    alert(
      "Select a person."
    );

    return;

  }


  state.events.unshift({

    id:
      crypto.randomUUID(),

    name:
      eventName,

    personId:
      personId,

    role:
      role,

    date:
      new Date().toISOString()

  });


  document.getElementById(
    "eventName"
  ).value = "";


  save();

}


/* =========================================================
   REMOVE PERSON
========================================================= */

function removePerson(discordId) {

  if (
    !confirm(
      "Remove this person and their events?"
    )
  ) {

    return;

  }


  state.people =
    state.people.filter(
      p => p.id !== discordId
    );


  state.events =
    state.events.filter(
      e => e.personId !== discordId
    );


  save();

}


/* =========================================================
   DELETE ALL
========================================================= */

function clearAll() {

  if (
    !confirm(
      "Delete ALL locally stored data?"
    )
  ) {

    return;

  }


  localStorage.removeItem(
    STORAGE_KEY
  );

  location.reload();

}


/* =========================================================
   RENDER
========================================================= */

function render() {

  renderPeople();

  renderPersonSelect();

  renderEvents();

  renderLeaderboard();

}


/* =========================================================
   PEOPLE
========================================================= */

function renderPeople() {

  const container =
    document.getElementById(
      "people"
    );


  if (!state.people.length) {

    container.innerHTML =
      '<div class="empty">No personnel yet.</div>';

    return;

  }


  container.innerHTML =
    state.people.map(person => {

      const avatar =
        person.avatar

          ? `
            <img
              class="avatar"
              src="${esc(person.avatar)}"
              alt=""
            >
          `

          : `
            <div class="avatar">
              ${esc(
                initials(
                  person.name
                )
              )}
            </div>
          `;


      return `

        <div class="person">

          ${avatar}

          <div class="info">

            <div class="name">
              ${esc(
                person.name
              )}
            </div>

            <div class="small">
              ${
                person.username
                  ? "@" +
                    esc(
                      person.username
                    )
                  : esc(
                      person.id
                    )
              }

              ${
                person.rank
                  ? " · " +
                    esc(
                      person.rank
                    )
                  : ""
              }

            </div>

            <div class="small">
              ID: ${esc(person.id)}
            </div>

          </div>


          <button
            class="secondary"
            style="width:auto"
            onclick="refreshPerson('${esc(person.id)}')"
            title="Refresh Discord profile"
          >
            ↻
          </button>


          <button
            class="danger"
            onclick="removePerson('${esc(person.id)}')"
          >
            ×
          </button>

        </div>

      `;

    }).join("");

}


/* =========================================================
   PERSON SELECT
========================================================= */

function renderPersonSelect() {

  const select =
    document.getElementById(
      "personSelect"
    );


  if (!state.people.length) {

    select.innerHTML =
      '<option value="">No personnel</option>';

    return;

  }


  select.innerHTML =
    state.people.map(person => `

      <option
        value="${esc(person.id)}"
      >

        ${esc(person.name)}

        ${
          person.username
            ? " — @" +
              esc(
                person.username
              )
            : ""
        }

      </option>

    `).join("");

}


/* =========================================================
   EVENTS
========================================================= */

function renderEvents() {

  const container =
    document.getElementById(
      "events"
    );


  if (!state.events.length) {

    container.innerHTML =
      '<div class="empty">No events yet.</div>';

    return;

  }


  container.innerHTML =
    state.events
      .slice(0, 15)
      .map(event => {

        const person =
          state.people.find(
            p =>
              p.id ===
              event.personId
          );


        return `

          <div class="event">

            <div class="info">

              <div class="name">
                ${esc(event.name)}
              </div>

              <div class="small">

                ${
                  esc(
                    person?.name ||
                    event.personId
                  )
                }

                ·

                ${
                  new Date(
                    event.date
                  ).toLocaleString()
                }

              </div>

            </div>


            <span class="pill">

              ${esc(
                event.role
              )}

            </span>

          </div>

        `;

      })
      .join("");

}


/* =========================================================
   LEADERBOARD
========================================================= */

function renderLeaderboard() {

  const container =
    document.getElementById(
      "leaderboard"
    );


  const points = {};


  state.people.forEach(
    person => {
      points[person.id] = 0;
    }
  );


  state.events.forEach(
    event => {

      if (
        points[event.personId] ===
        undefined
      ) {

        points[event.personId] = 0;

      }


      if (
        event.role ===
        "host"
      ) {

        points[event.personId] += 3;

      }

      else if (
        event.role ===
        "cohost"
      ) {

        points[event.personId] += 2;

      }

      else {

        points[event.personId] += 1;

      }

    }
  );


  const people =
    [...state.people]
      .sort(
        (a, b) =>
          (points[b.id] || 0) -
          (points[a.id] || 0)
      );


  if (!people.length) {

    container.innerHTML =
      '<div class="empty">No personnel yet.</div>';

    return;

  }


  container.innerHTML =
    people.map(
      (person, index) => `

        <div class="event">

          <span class="pill">
            #${index + 1}
          </span>

          <div class="info">

            <div class="name">
              ${esc(person.name)}
            </div>

            <div class="small">
              ${esc(person.id)}
            </div>

          </div>

          <strong>
            ${points[person.id] || 0}
            pts
          </strong>

        </div>

      `
    ).join("");

}


/* =========================================================
   START
========================================================= */

render();

</script>

</body>
</html>
