document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const typing=tag==='input'||tag==='textarea'||e.target.isContentEditable;
  if(typing)return;
  const modalOpen=g('overlay').classList.contains('show');
  /* If the user is part-way through typing the secret code, let it finish
     instead of firing single-letter shortcuts. */
  if(adminCodeInProgress(e.key))return;
  if(e.key==='/'){e.preventDefault();searchInput.focus();}
  else if(e.key==='n'){e.preventDefault();if(!modalOpen)openNewEventModal();}
  else if(e.key==='?'){e.preventDefault();if(!modalOpen)openShortcutsModal();}
  else if(!modalOpen&&(e.key==='a'||e.key==='p'||e.key==='e')){
    e.preventDefault();
    switchView(e.key==='a'?'analytics':e.key==='p'?'personnel':'events');
  }
});

/* Secret admin panel — type "admin" anywhere (not while typing in a field) to open it.
   adminCodeInProgress() is called first by the shortcut handler so that typing the
   code doesn't also trigger the A / N single-key shortcuts. */
const ADMIN_CODE='admin';
let _adminBuf='';let _adminBufAt=0;
function adminCodeInProgress(key){
  if(!key||key.length!==1)return false;
  const now=Date.now();
  if(now-_adminBufAt>1200)_adminBuf='';
  _adminBufAt=now;
  const next=(_adminBuf+key.toLowerCase()).slice(-ADMIN_CODE.length);
  /* does the tail of what's been typed form a prefix of the code? */
  let matched='';
  for(let i=0;i<next.length;i++){
    const tail=next.slice(i);
    if(ADMIN_CODE.startsWith(tail)){matched=tail;break;}
  }
  _adminBuf=matched;
  if(matched===ADMIN_CODE){
    _adminBuf='';
    if(!g('overlay').classList.contains('show'))openAdminPanel();
    return true;
  }
  return matched.length>0;
}

/* Persistence */
async function loadEvents(){
  setStatus('saving');g('statusText').textContent='syncing...';
  try{
    const r=await fetch(`${BASE}/latest`,{headers:{'X-Master-Key':API_KEY}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();const rec=d.record;
    state.events=Array.isArray(rec)?rec:Array.isArray(rec?.events)?rec.events:[];
    state.personnel=Array.isArray(rec?.personnel)?rec.personnel:[];
    state.webhookUrl=(typeof rec?.webhookUrl==='string'&&rec.webhookUrl)?rec.webhookUrl:DEFAULT_LOG_WEBHOOK;
    state.eventWebhookUrl=(typeof rec?.eventWebhookUrl==='string'&&rec.eventWebhookUrl)?rec.eventWebhookUrl:DEFAULT_EVENT_WEBHOOK;
    state.adjustments=Array.isArray(rec?.adjustments)?rec.adjustments:[];
    state.warnings=Array.isArray(rec?.warnings)?rec.warnings:[];
    state.settings={...DEFAULT_SETTINGS,...(rec?.settings&&typeof rec.settings==='object'?rec.settings:{})};
    g('statusText').textContent='operational';setStatus('ok');render();
  }catch(e){
    console.error(e);g('statusText').textContent='offline';setStatus('err');

async function saveEvents(){

    const r=await fetch(BASE,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},body:JSON.stringify({events:state.events,personnel:state.personnel,webhookUrl:state.webhookUrl,eventWebhookUrl:state.eventWebhookUrl,adjustments:state.adjustments,warnings:state.warnings,settings:state.settings})});

function exportBackup(){

/* Send event to the separate event-announcement webhook, with an image */
async function sendEventToWebhook(eventId,imageUrl){
  if(!state.eventWebhookUrl)return false;
  const ev=state.events.find(e=>e.id===eventId);if(!ev)return false;
  const h=ev.host||[],c=ev.cohost||[],a=ev.attendee||[];
  const rosterLine=(arr)=>arr.length?arr.map(p=>p.discordId?`<@${p.discordId}>`:(p.username||'?')).join(', '):'_none_';
  const fields=[
    {name:'Host',value:rosterLine(h),inline:false},
    {name:'Co-Host',value:rosterLine(c),inline:false},
    {name:'Attendee',value:rosterLine(a),inline:false},
  ];
  const embed={
    title:ev.name,
    description:[ev.note?plainText(ev.note):null,ev.date?`Date: \`${ev.date}\``:null,`Type: \`${eventTypeLabel(ev)}${eventMultiplier(ev)>1?' (2x points)':''}\``].filter(Boolean).join('\n'),
    color:eventMultiplier(ev)>1?0xbf5af2:0x0a84ff,
    fields,
    footer:{text:'JTTF Events'},
    timestamp:new Date().toISOString()
  };
  if(imageUrl)embed.image={url:imageUrl};
  const payload={embeds:[embed]};
  try{
    const r=await fetch(state.eventWebhookUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return true;
  }catch(e){console.error('Event webhook failed',e);return false;}
}

      else if(e.key==='ArrowUp'){e.preventDefault();acIdx=Math.max(acIdx-1,0);items.forEach((it,i)=>it.classList.toggle('active',i===acIdx));}
      else if(e.key==='Enter'&&acIdx>=0){e.preventDefault();selectAcItem(drop._matches[acIdx]);}

    };

      showToast('Adjustment removed',false,()=>{state.adjustments.splice(idx,0,removed);saveEvents();render();renderAdminAdjList();});
    });

    renderAdminWarnList();
    g('adminWarnBtn').onclick=()=>{
      const username=pName.value.trim(),discordId=pId.value.trim();
      if(!username&&!discordId){showToast('Select or enter a person first.',true);return;}

      const btn=e.target.closest('[data-act="del-warn"]');if(!btn)return;

      renderAdminWarnList();
    });
  });

    </div>
    ${status&&status.tracked?`<div style="flex-basis:100%">${promoProgressHtml(key)}</div>`:''}
  </div>`;
}
function visiblePersonnel(){
  const q=personnelQuery.trim().toLowerCase();
  let list=[...state.personnel];
  if(q)list=list.filter(p=>(p.username||'').toLowerCase().includes(q)||(p.discordId||'').includes(q)||(p.rank||'').toLowerCase().includes(q));
  if(personnelSort==='az')list.sort((a,b)=>(a.username||'').localeCompare(b.username||''));
  else if(personnelSort==='za')list.sort((a,b)=>(b.username||'').localeCompare(a.username||''));
  else if(personnelSort==='rank')list.sort((a,b)=>rankIndex(normalizeRank(b.rank))-rankIndex(normalizeRank(a.rank)));
  else if(personnelSort==='events')list.sort((a,b)=>buildProfile(personnelKey(b)).eventCount-buildProfile(personnelKey(a)).eventCount);
  else if(personnelSort==='recent')list.reverse();
  else if(personnelSort==='eligible')list.sort((a,b)=>{
    const sa=promotionStatus(personnelKey(a)),sb=promotionStatus(personnelKey(b));
    const va=sa&&sa.tracked&&sa.eligible?1:0,vb=sb&&sb.tracked&&sb.eligible?1:0;
    return vb-va;
  });
  return list;
}

function handlePersonnelAction(e){

    state.personnel.splice(idx,1);saveEvents();renderPersonnelPage();

function openAddPersonModal(eventId,role){
  const cfg=roleCfg[role];const existingPeople=combinedPeoplePool();
  openModal(`
    <h3><span class="role-dot" style="background:${cfg.color}"></span>Add ${cfg.label}</h3>
    <div class="field"><label for="pName">Discord username</label>
      <div class="field-inner"><input id="pName" type="text" placeholder="e.g. nova.exe" autocomplete="off"><div class="autocomplete-drop" id="acDrop"></div></div>

    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn-confirm" id="confirmBtn" style="background:${cfg.color};color:#fff">Confirm</button>
    </div>`,()=>{
    g('cancelBtn').onclick=closeModal;
    const pName=g('pName'),pId=g('pId'),drop=g('acDrop');let acIdx=-1;
    function selectAcItem(p){pName.value=p.username||'';pId.value=p.discordId||'';drop.classList.remove('show');acIdx=-1;}
    pName.addEventListener('input',()=>{
      const q=pName.value.trim();if(!q){drop.classList.remove('show');return;}
      const seen=new Set();
      const matches=existingPeople.filter(p=>{
        const k=personKey(p);
        if(!p.username||seen.has(k))return false;
        seen.add(k);
        return p.username.toLowerCase().includes(q.toLowerCase());
      }).slice(0,6);
      if(!matches.length){drop.classList.remove('show');return;}
      const rc={host:'var(--host)',cohost:'var(--cohost)',attendee:'var(--attendee)'};
      drop.innerHTML=matches.map((p,i)=>{
        const rank=rankFor(personKey(p));
        return `<div class="ac-item" data-idx="${i}"><div class="ac-avatar" style="background:${rc[p.role]}22;color:${rc[p.role]}">${esc(initials(p.username))}</div><div class="ac-info"><div class="ac-name">${esc(p.username)}</div><div class="ac-sub">${p.discordId?esc(p.discordId):'no ID'}${p._fromRoster?' &middot; roster':''}</div></div><div class="ac-tags">${!p._fromRoster?`<span class="ac-role" style="background:${rc[p.role]}1f;color:${rc[p.role]}">${p.role}</span>`:''}${rank?`<span class="rank-badge sm">${esc(rank)}</span>`:''}</div></div>`;
      }).join('');
      drop._matches=matches;drop.classList.add('show');acIdx=-1;
    });
    pName.addEventListener('keydown',e=>{
      const items=[...drop.querySelectorAll('.ac-item')];if(!items.length)return;
      if(e.key==='ArrowDown'){e.preventDefault();acIdx=Math.min(acIdx+1,items.length-1);items.forEach((it,i)=>it.classList.toggle('active',i===acIdx));}
      else if(e.key==='ArrowUp'){e.preventDefault();acIdx=Math.max(acIdx-1,0);items.forEach((it,i)=>it.classList.toggle('active',i===acIdx));}
      else if(e.key==='Enter'&&acIdx>=0){e.preventDefault();selectAcItem(drop._matches[acIdx]);}
      else if(e.key==='Escape'){drop.classList.remove('show');}
    });
    drop.addEventListener('click',e=>{const item=e.target.closest('.ac-item');if(!item)return;selectAcItem(drop._matches[+item.dataset.idx]);});
    g('confirmBtn').onclick=()=>{
      const username=pName.value.trim(),discordId=pId.value.trim();
      if(!username&&!discordId){showToast('Add a username or ID first.',true);return;}

  });
}

/* Remove person */
function removePerson(eventId,role,personId){
  const ev=state.events.find(e=>e.id===eventId);if(!ev)return;
  const idx=(ev[role]||[]).findIndex(p=>p.id===personId);
  const person=ev[role][idx];
  ev[role]=ev[role].filter(p=>p.id!==personId);persist();
  if(person){
    sendWebhook('remove',`Removed ${person.username||person.discordId||'Unknown'} (${roleCfg[role].label}) from ${ev.name}`);
    showToast(`Removed ${person.username||person.discordId}`,false,()=>{
      ev[role].splice(idx,0,person);persist();showToast('Restored.');
    });
  }
}

/* Move person between roles */
function movePerson(eventId,fromRole,personId,toRole){
  if(fromRole===toRole)return;
  const ev=state.events.find(e=>e.id===eventId);if(!ev)return;
  const idx=(ev[fromRole]||[]).findIndex(p=>p.id===personId);
  if(idx===-1)return;
  const [person]=ev[fromRole].splice(idx,1);
  ev[toRole].push(person);persist();
  sendWebhook('move',`Moved ${person.username||person.discordId||'Unknown'} from ${roleCfg[fromRole].label} to ${roleCfg[toRole].label} in ${ev.name}`);
  requestAnimationFrame(()=>{
    const pill=document.querySelector(`.person-pill[data-pid="${personId}"][data-role="${toRole}"]`);
    if(pill)pill.classList.add('landed');
  });
}

/* Copy roster */
function copyRoster(eventId){
  const ev=state.events.find(e=>e.id===eventId);if(!ev)return;
  const lines=[`# ${ev.name}`];
  if(ev.note)lines.push(`_${ev.note}_`);
  if(eventMultiplier(ev)>1)lines.push(`_${eventTypeLabel(ev)} \u2014 2x points_`);
  for(const role of['host','cohost','attendee']){
    const arr=ev[role]||[];if(!arr.length)continue;
    lines.push(`\n**${roleCfg[role].label}**`);
    arr.forEach(p=>lines.push(p.discordId?`<@${p.discordId}>`:(p.username||'?')));
  }
  navigator.clipboard.writeText(lines.join('\n')).then(()=>showToast('Roster copied.')).catch(()=>showToast('Copy failed.',true));
}

/* CSV export */
function exportLeaderboardCsv(){
  const data=leaderboardData(eventsForPeriod(lbPeriod),lbPeriod==='total');
  if(!data.length){showToast('Nothing to export yet.',true);return;}
  const rows=[['Name','Discord ID','Rank','Host','Co-Host','Attendee','Events','Total Score']];
  [...data].sort((a,b)=>b.total-a.total).forEach(e=>rows.push([e.username||'',e.discordId||'',rankFor(e.key)||'',e.host,e.cohost,e.attendee,e.eventCount,e.total]));
  const csv=rows.map(r=>r.map(v=>{const s=String(v??'');return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;}).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`jttf-standings-${todayStr()}.csv`;a.click();URL.revokeObjectURL(url);
  showToast('Standings exported.');
}
g('exportCsvBtn').addEventListener('click',exportLeaderboardCsv);

/* Leaderboard */
function leaderboardData(eventsSubset,includeAdjustments){
  const map=new Map();
  for(const ev of eventsSubset){
    const mult=eventMultiplier(ev);
    for(const role of['host','cohost','attendee']){
      for(const p of(ev[role]||[])){
        const key=personKey(p);
        if(!map.has(key))map.set(key,{username:p.username,discordId:p.discordId,key,host:0,cohost:0,attendee:0,points:0,events:new Set()});
        const entry=map.get(key);entry[role]++;entry.events.add(ev.id);
        entry.points=(entry.points||0)+ROLE_POINTS[role]*mult;
        if(!entry.username&&p.username)entry.username=p.username;
        if(!entry.discordId&&p.discordId)entry.discordId=p.discordId;
      }
    }
  }
  if(includeAdjustments)applyAdjustmentsToMap(map);
  return [...map.values()].map(e=>({...e,eventCount:e.events.size,hosting:e.host+e.cohost,total:e.points}));
}
function overallPlacement(key){
  const ranked=leaderboardData(state.events,true).filter(e=>e.total>0).sort((a,b)=>b.total-a.total);
  const idx=ranked.findIndex(e=>e.key===key);
  return idx===-1?null:idx+1;
}
function eventsForPeriod(period){
  if(period==='total')return state.events;
  const now=new Date();const thisWk=weekBounds(now);let start,end;
  if(period==='thisweek'){start=thisWk.start;end=thisWk.end;}
  else{end=new Date(thisWk.start);end.setDate(end.getDate()-1);start=new Date(end);start.setDate(start.getDate()-6);}
  return state.events.filter(ev=>{const d=parseEventDate(ev);return d&&inRange(d,start,end);});
}
let lbPeriod='total',lbMetric='total';
function updateLbRange(){
  const rangeEl=g('lbRange');if(lbPeriod==='total'){rangeEl.textContent='';return;}
  const now=new Date();const thisWk=weekBounds(now);let start,end;
  if(lbPeriod==='thisweek'){start=thisWk.start;end=thisWk.end;}
  else{end=new Date(thisWk.start);end.setDate(end.getDate()-1);start=new Date(end);start.setDate(start.getDate()-6);}
  rangeEl.textContent=`${fmtShort(start)} \u2014 ${fmtShort(end)}`;
}
function renderLeaderboard(){
  updateLbRange();
  const list=g('lbList');
  const prevPositions=new Map();
  list.querySelectorAll('.lb-row[data-key]').forEach(row=>{prevPositions.set(row.dataset.key,row.getBoundingClientRect());});
  const evSubset=eventsForPeriod(lbPeriod);const data=leaderboardData(evSubset,lbPeriod==='total');
  if(!data.length){list.innerHTML=`<div class="lb-empty"><svg class="icon" aria-hidden="true"><use href="#i-shield-off"></use></svg>${lbPeriod==='total'?'No activity recorded.':'No events in this period.'}</div>`;return;}
  const sortKey=lbMetric==='total'?'total':lbMetric==='events'?'eventCount':'hosting';
  const sorted=[...data].sort((a,b)=>b[sortKey]-a[sortKey]).filter(e=>e[sortKey]>0).slice(0,10);
  if(!sorted.length){list.innerHTML=`<div class="lb-empty"><svg class="icon"><use href="#i-shield-off"></use></svg>No data.</div>`;return;}
  list.innerHTML=sorted.map((e,i)=>{
    const name=e.username||e.discordId||'Unknown';
    const streak=personStreak(e.key);
    return `<div class="lb-row" data-key="${esc(e.key)}" onclick="openProfileModal('${esc(e.key)}')">
      <span class="lb-rank">${i+1}</span>
      <div class="lb-avatar">${esc(initials(name))}</div>
      <div class="lb-info">
        <div class="lb-name" title="${esc(name)}">${esc(name)}${streak>=3?` <span class="lb-streak" title="${streak}-event streak"><svg class="icon" aria-hidden="true"><use href="#i-flame"></use></svg>${streak}</span>`:''}</div>
        <div class="lb-breakdown">${e.host?`<span class="h">${e.host}H</span>`:''}${e.cohost?`<span class="c">${e.cohost}C</span>`:''}${e.attendee?`<span class="a">${e.attendee}A</span>`:''}</div>
      </div>
      <span class="lb-score" data-score="${e[sortKey]}">${e[sortKey]}</span>
    </div>`;
  }).join('');
  const newRows=[...list.querySelectorAll('.lb-row[data-key]')];
  let anyAnimated=false;
  newRows.forEach(row=>{
    const key=row.dataset.key;const prev=prevPositions.get(key);
    if(!prev)return;
    row.style.animation='none';
    const next=row.getBoundingClientRect();
    const dy=prev.top-next.top;

  if(f==='empty')return((ev.host?.length||0)+(ev.cohost?.length||0)+(ev.attendee?.length||0))===0;
  if(f==='week'){const d=parseEventDate(ev);const {start,end}=weekBounds(new Date());return d&&inRange(d,start,end);}
  return true;
}

/* ---------- Bulk paste parsing ---------- */
/* Accepts one per line or comma separated. Understands <@123>, raw IDs,
   "name - 123", "name (123)" and plain usernames. */
function parseBulkInput(text){
  const out=[];const seen=new Set();
  text.split(/[\n,]+/).forEach(raw=>{
    let line=raw.trim();if(!line)return;
    line=line.replace(/^[-*\u2022]\s*/,'');
    let username='',discordId='';
    const mention=line.match(/<@!?(\d{5,})>/);
    if(mention){discordId=mention[1];username=line.replace(mention[0],'').replace(/[-–—()|]/g,' ').trim();}
    else{
      const pair=line.match(/^(.*?)[\s\-–—|()]+(\d{15,25})\)?$/);
      if(pair){username=pair[1].trim();discordId=pair[2];}
      else if(/^\d{15,25}$/.test(line)){discordId=line;}
      else{username=line;}
    }
    username=username.replace(/^@/,'').trim();
    if(!username&&!discordId)return;
    const r=resolveEntry(username,discordId);
    if(seen.has(r.key))return;seen.add(r.key);
    out.push(r);
  });
  return out;
}
/* Match a pasted name or ID against people we already know, so that pasting
   "nova.exe" for someone whose Discord ID is on file reuses their existing
   identity instead of creating a second, points-splitting record. */
function resolveEntry(username,discordId){
  const pool=combinedPeoplePool();
  if(!discordId&&username){
    const hit=pool.find(p=>(p.username||'').toLowerCase()===username.toLowerCase()&&p.discordId);
    if(hit)discordId=hit.discordId;
  }else if(discordId&&!username){
    const hit=pool.find(p=>p.discordId===discordId&&p.username);
    if(hit)username=hit.username;
  }
  return {username,discordId,key:(discordId||username).toLowerCase(),matched:!!(discordId&&username)};
}
function bulkPreviewHtml(entries,existingKeys){
  if(!entries.length)return'';
  return entries.map(e=>{
    const dupe=existingKeys&&existingKeys.has(e.key);

  }).join('');
}

/* ---------- Analytics ---------- */
function weeklySeries(count){
  const now=new Date();now.setHours(0,0,0,0);
  const weeks=[];
  for(let w=count-1;w>=0;w--){
    const ref=new Date(now);ref.setDate(now.getDate()-w*7);
    const {start,end}=weekBounds(ref);
    const evs=state.events.filter(ev=>{const d=parseEventDate(ev);return d&&inRange(d,start,end);});
    let pts=0,people=new Set();
    evs.forEach(ev=>{
      const mult=eventMultiplier(ev);
      ['host','cohost','attendee'].forEach(role=>(ev[role]||[]).forEach(p=>{pts+=ROLE_POINTS[role]*mult;people.add(personKey(p));}));
    });
    weeks.push({label:fmtShort(start),events:evs.length,points:pts,people:people.size});
  }
  return weeks;
}
function renderAnalytics(){
  const box=g('analyticsView');if(!box)return;
  const evs=state.events;
  if(!evs.length){
    box.innerHTML=`<div class="empty-state"><div class="empty-icon"><svg class="icon" aria-hidden="true"><use href="#i-chart-pie"></use></svg></div><h3>Nothing to analyse yet</h3><p>Log a few events and this fills in.</p></div>`;
    return;
  }
  const data=leaderboardData(evs,true);
  let h=0,c=0,a=0,totalPts=0;
  evs.forEach(ev=>{
    const m=eventMultiplier(ev);
    h+=(ev.host?.length||0);c+=(ev.cohost?.length||0);a+=(ev.attendee?.length||0);
    totalPts+=((ev.host?.length||0)*3+(ev.cohost?.length||0)*2+(ev.attendee?.length||0))*m;
  });
  const slots=h+c+a||1;
  const divCount=evs.filter(ev=>eventMultiplier(ev)>1).length;
  const weeks=weeklySeries(12);
  const maxEv=Math.max(...weeks.map(w=>w.events),1);
  const avgPerEvent=Math.round(slots/evs.length*10)/10;
  const thisWk=weeks[weeks.length-1],lastWk=weeks[weeks.length-2]||{events:0,points:0};
  const delta=thisWk.points-lastWk.points;

  const barChart=weeks.map(w=>`
    <div class="an-bar-wrap">
      <div class="an-tip">${w.label} &middot; ${w.events} ev &middot; ${w.points}pt</div>
      <div class="an-bar ${w.events?'':'dim'}" style="height:${Math.max(Math.round((w.events/maxEv)*100),3)}%"></div>
      <div class="an-bar-lbl">${w.label.split(' ')[1]||''}</div>
    </div>`).join('');

  const topBy=(field,n)=>[...data].sort((x,y)=>y[field]-x[field]).filter(x=>x[field]>0).slice(0,n);
  const rowsFor=(list,field)=>{
    if(!list.length)return `<div class="an-empty">No data yet.</div>`;
    const max=list[0][field]||1;
    return list.map((e,i)=>{
      const name=e.username||e.discordId||'Unknown';
      return `<div class="an-row" onclick="openProfileModal('${esc(e.key)}')">
        <span class="n">${i+1}</span>
        <span class="nm">${esc(name)}</span>
        <span class="an-track"><i style="width:${Math.round((e[field]/max)*100)}%"></i></span>
        <span class="vl">${e[field]}</span>
      </div>`;
    }).join('');
  };

  const inactive=inactiveList().slice(0,8);
  const inactiveHtml=inactive.length?inactive.map(p=>`
    <div class="an-row" onclick="openProfileModal('${esc(p.key)}')">
      <span class="nm">${esc(p.name)}</span>
      ${p.rank?`<span class="rank-badge sm">${esc(p.rank)}</span>`:''}
      <span class="an-pill ${p.weeks===null?'bad':p.weeks>=6?'bad':'warn'}">${p.weeks===null?'never':`${p.weeks}w ago`}</span>
    </div>`).join(''):`<div class="an-empty">Everyone's been active recently.</div>`;

  const q=state.settings.weeklyQuota||0;
  let quotaHtml='';
  if(q){
    const roster=state.personnel.length?state.personnel.map(p=>personnelKey(p)):[...new Set(allPeople().map(p=>personKey(p)))];
    const rows=roster.map(k=>{const prof=buildProfile(k);return{key:k,name:prof.username||prof.discordId||'Unknown',pts:pointsInPeriod(k,'thisweek')};}).sort((x,y)=>y.pts-x.pts);
    const met=rows.filter(r=>r.pts>=q).length;
    quotaHtml=`<div class="an-card wide">
      <div class="an-card-title"><span>Weekly quota &mdash; ${q}pt target</span><span style="color:${met===rows.length?'var(--attendee)':'var(--host)'}">${met}/${rows.length} on track</span></div>
      ${rows.slice(0,12).map(r=>`<div class="an-row" onclick="openProfileModal('${esc(r.key)}')">
        <span class="nm">${esc(r.name)}</span>
        <span class="an-track"><i style="width:${Math.min(100,Math.round((r.pts/q)*100))}%;background:${r.pts>=q?'var(--attendee)':'var(--host)'}"></i></span>
        <span class="an-pill ${r.pts>=q?'ok':'warn'}">${r.pts}/${q}</span>
      </div>`).join('')}
      ${rows.length>12?`<div class="an-empty">+${rows.length-12} more</div>`:''}
    </div>`;
  }

  const promos=state.personnel
    .map(p=>({key:personnelKey(p),name:p.username||p.discordId||'Unknown',status:promotionStatus(personnelKey(p))}))
    .filter(p=>p.status&&p.status.tracked&&p.status.eligible);
  const promoHtml=promos.length?`<div class="an-card">
    <div class="an-card-title"><span>Ready to promote</span><span style="color:var(--attendee)">${promos.length}</span></div>
    ${promos.slice(0,6).map(p=>`<div class="an-row" onclick="openProfileModal('${esc(p.key)}')">
      <span class="nm">${esc(p.name)}</span>
      <span class="an-pill ok">${esc(p.status.rank)} \u2192 ${esc(p.status.toRank)}</span>
    </div>`).join('')}
    ${promos.length>6?`<div class="an-empty">+${promos.length-6} more</div>`:''}
  </div>`:'';

  box.innerHTML=`
    <div class="an-grid">
      <div class="an-card">
        <div class="an-card-title">Points awarded</div>
        <div class="an-big">${totalPts}</div>
        <div class="an-sub">across ${evs.length} event${evs.length!==1?'s':''} &middot; ${divCount} division (2&times;)</div>
      </div>
      <div class="an-card">
        <div class="an-card-title">This week</div>
        <div class="an-big" style="color:${delta>=0?'var(--attendee)':'var(--danger)'}">${thisWk.points}<span style="font-size:.9rem;color:var(--text-muted);font-family:ui-monospace,monospace"> pt</span></div>
        <div class="an-sub">${thisWk.events} event${thisWk.events!==1?'s':''} &middot; ${delta>=0?'+':''}${delta} vs last week</div>
      </div>
      <div class="an-card">
        <div class="an-card-title">Avg. turnout</div>
        <div class="an-big">${avgPerEvent}</div>
        <div class="an-sub">people per event &middot; ${new Set(allPeople().map(p=>personKey(p))).size} unique total</div>
      </div>
      <div class="an-card">
        <div class="an-card-title">Roster coverage</div>
        <div class="an-big" style="color:${unrosteredPeople().length?'var(--host)':'var(--attendee)'}">${state.personnel.length}</div>
        <div class="an-sub">${unrosteredPeople().length?`${unrosteredPeople().length} in events without a record`:'everyone in events is on the roster'}</div>
      </div>

      <div class="an-card wide">
        <div class="an-card-title"><span>Events per week &mdash; last 12</span><span style="color:var(--text-muted)">hover for detail</span></div>
        <div class="an-bars">${barChart}</div>
      </div>

      <div class="an-card">
        <div class="an-card-title">Role split</div>
        <div class="an-split">
          <span style="width:${(h/slots)*100}%;background:var(--host)"></span>
          <span style="width:${(c/slots)*100}%;background:var(--cohost)"></span>
          <span style="width:${(a/slots)*100}%;background:var(--attendee)"></span>
        </div>
        <div class="an-legend">
          <span><i style="background:var(--host)"></i>${h} host</span>
          <span><i style="background:var(--cohost)"></i>${c} co-host</span>
          <span><i style="background:var(--attendee)"></i>${a} attendee</span>
        </div>
      </div>

      <div class="an-card">
        <div class="an-card-title">Top scorers</div>
        ${rowsFor(topBy('total',5),'total')}
      </div>
      <div class="an-card">
        <div class="an-card-title">Most hosting</div>
        ${rowsFor(topBy('hosting',5),'hosting')}
      </div>
      <div class="an-card">
        <div class="an-card-title"><span>Inactive ${state.settings.inactiveWeeks||3}+ weeks</span><span style="color:var(--host)">${inactive.length||''}</span></div>
        ${inactiveHtml}
      </div>
      ${promoHtml}
      ${quotaHtml}
    </div>`;

  box.querySelectorAll('.an-bar').forEach(b=>{
    const hgt=b.style.height;b.style.height='0';
    requestAnimationFrame(()=>{b.style.height=hgt;});
  });
}

/* ---------- Weekly recap ---------- */
function buildRecap(period){
  const evs=eventsForPeriod(period);
  const {start,end}=(()=>{
    const thisWk=weekBounds(new Date());
    if(period==='thisweek')return thisWk;
    const e=new Date(thisWk.start);e.setDate(e.getDate()-1);
    const s=new Date(e);s.setDate(s.getDate()-6);
    return {start:s,end:e};
  })();
  const data=leaderboardData(evs,false).sort((a,b)=>b.total-a.total);
  let pts=0;const people=new Set();
  evs.forEach(ev=>{
    const m=eventMultiplier(ev);
    ['host','cohost','attendee'].forEach(r=>(ev[r]||[]).forEach(p=>{pts+=ROLE_POINTS[r]*m;people.add(personKey(p));}));
  });
  const q=state.settings.weeklyQuota||0;
  let misses=[];
  if(q&&period==='thisweek'){
    const roster=state.personnel.length?state.personnel.map(p=>personnelKey(p)):[...new Set(allPeople().map(p=>personKey(p)))];
    misses=roster.map(k=>{const prof=buildProfile(k);return{key:k,name:prof.username||prof.discordId||'Unknown',pts:pointsInPeriod(k,'thisweek')};})
      .filter(r=>r.pts<q).sort((a,b)=>a.pts-b.pts);
  }
  return {start,end,events:evs,points:pts,people:people.size,top:data.slice(0,5),misses,quota:q,period};
}
function recapEmbed(rc){
  const range=`${fmtShort(rc.start)} \u2013 ${fmtShort(rc.end)}`;
  const medals=['\uD83E\uDD47','\uD83E\uDD48','\uD83E\uDD49','4.','5.'];
  const topLines=rc.top.length
    ? rc.top.map((e,i)=>`${medals[i]} **${e.username||e.discordId||'Unknown'}** \u2014 ${e.total} pts (${e.host}H ${e.cohost}C ${e.attendee}A)`).join('\n')
    : '_Nobody logged points this week._';
  const evLines=rc.events.length
    ? rc.events.slice(0,10).map(ev=>{
        const n=(ev.host?.length||0)+(ev.cohost?.length||0)+(ev.attendee?.length||0);
        return `\u2022 **${plainText(ev.name)}**${eventMultiplier(ev)>1?` (${DIVISION_LABELS[ev.division]||'Div'} \u00D72)`:''} \u2014 ${n} attending`;
      }).join('\n')
    : '_No operations logged._';
  const fields=[
    {name:'Operations',value:`\`${rc.events.length}\``,inline:true},
    {name:'Points earned',value:`\`${rc.points}\``,inline:true},
    {name:'Personnel active',value:`\`${rc.people}\``,inline:true},
    {name:'Leaderboard',value:topLines,inline:false},
    {name:'Operations run',value:evLines,inline:false}
  ];
  if(rc.quota&&rc.misses.length){
    fields.push({name:`Below the ${rc.quota}pt quota (${rc.misses.length})`,
      value:rc.misses.slice(0,15).map(m=>`${m.name} \u2014 ${m.pts}`).join('\n')+(rc.misses.length>15?`\n_+${rc.misses.length-15} more_`:''),inline:false});
  }else if(rc.quota){
    fields.push({name:'Quota',value:`Everyone cleared ${rc.quota} points \u2705`,inline:false});
  }
  return {
    title:`${rc.period==='thisweek'?'Weekly':'Last week\u2019s'} recap \u2014 ${range}`,
    color:0x3b9dff,
    fields,
    footer:{text:'JTTF Events'},
    timestamp:new Date().toISOString()
  };
}
function openRecapModal(){
  let period='thisweek';
  function body(){
    const rc=buildRecap(period);
    const range=`${fmtShort(rc.start)} \u2013 ${fmtShort(rc.end)}`;
    return `
      <div class="lb-period-tabs" style="margin-bottom:12px">
        <button class="lb-period-tab ${period==='thisweek'?'active':''}" data-p="thisweek">This week</button>
        <button class="lb-period-tab ${period==='lastweek'?'active':''}" data-p="lastweek">Last week</button>
      </div>
      <div class="att-insight">
        <div class="att-insight-head">${range}</div>
        <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:6px">
          <div><div class="an-big" style="font-size:1.5rem">${rc.events.length}</div><div class="an-sub">operations</div></div>
          <div><div class="an-big" style="font-size:1.5rem">${rc.points}</div><div class="an-sub">points</div></div>
          <div><div class="an-big" style="font-size:1.5rem">${rc.people}</div><div class="an-sub">people active</div></div>
        </div>
      </div>
      <div style="margin-top:14px">
        <div class="profile-section-title" style="margin-bottom:6px">Leaderboard</div>
        ${rc.top.length?rc.top.map((e,i)=>`<div class="an-row"><span class="n">${i+1}</span><span class="nm">${esc(e.username||e.discordId||'Unknown')}</span><span class="vl">${e.total}</span></div>`).join(''):`<div class="an-empty">Nobody logged points in this window.</div>`}
      </div>
      ${rc.quota?`<div style="margin-top:14px">
        <div class="profile-section-title" style="margin-bottom:6px">${rc.misses.length?`Below the ${rc.quota}pt quota`:'Quota'}</div>
        ${rc.misses.length?rc.misses.slice(0,8).map(m=>`<div class="an-row"><span class="nm">${esc(m.name)}</span><span class="an-pill warn">${m.pts}/${rc.quota}</span></div>`).join('')+(rc.misses.length>8?`<div class="an-empty">+${rc.misses.length-8} more</div>`:''):`<div class="an-empty">Everyone cleared it.</div>`}
      </div>`:''}
      <div class="modal-actions">
        <button class="btn-secondary" id="copyRecapBtn"><svg class="icon" aria-hidden="true"><use href="#i-clipboard-copy"></use></svg> Copy text</button>
        <button class="btn-confirm" id="postRecapBtn" style="background:var(--accent);color:#fff"><svg class="icon" aria-hidden="true"><use href="#i-brand-discord"></use></svg> Post to Discord</button>
      </div>`;
  }
  function wire(){
    g('modalBox').classList.add('wide');
    g('modalBox').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{period=b.dataset.p;g('modalBox').innerHTML=`<h3><svg class="icon" style="color:var(--accent)" aria-hidden="true"><use href="#i-broadcast"></use></svg> Weekly recap</h3>`+body();wire();});
    g('copyRecapBtn').onclick=()=>{
      const rc=buildRecap(period);const em=recapEmbed(rc);
      const txt=`**${em.title}**\n\n`+em.fields.map(f=>`**${f.name}**\n${f.value}`).join('\n\n');
      navigator.clipboard.writeText(txt).then(()=>showToast('Recap copied.')).catch(()=>showToast('Copy failed.',true));
    };
    g('postRecapBtn').onclick=async()=>{
      const url=state.eventWebhookUrl||state.webhookUrl;
      if(!url){showToast('Add a webhook in Settings first.',true);return;}
      const btn=g('postRecapBtn');const orig=btn.innerHTML;
      btn.disabled=true;btn.innerHTML='<svg class="icon spin" aria-hidden="true"><use href="#i-loader-2"></use></svg> Posting...';
      try{
        const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({embeds:[recapEmbed(buildRecap(period))]})});
        if(!r.ok)throw new Error('HTTP '+r.status);
        closeModal();showToast('Recap posted.');
      }catch(e){
        console.error(e);btn.disabled=false;btn.innerHTML=orig;showToast('Could not post the recap.',true);
      }
    };
  }
  openModal(`<h3><svg class="icon" style="color:var(--accent)" aria-hidden="true"><use href="#i-broadcast"></use></svg> Weekly recap</h3>`+body(),wire);
}
g('recapBtn').addEventListener('click',openRecapModal);

/* Inline edit: event note */
function startEditNote(eventId){
  const ev=state.events.find(e=>e.id===eventId);if(!ev)return;
  const card=document.querySelector(`.event-card[data-evid="${eventId}"]`);if(!card)return;
  const el=card.querySelector('.event-note span')||card.querySelector('.event-note-add');
  if(!el)return;
  const old=ev.note||'';
  const input=document.createElement('input');
  input.className='event-note-input';input.value=old;input.placeholder='Location, objective, anything worth remembering';
  el.replaceWith(input);input.focus();input.select();
  let done=false;
  function commit(){
    if(done)return;done=true;
    const val=input.value.trim();
    if(val!==old){ev.note=val;persist();sendWebhook('edit',`Note on ${ev.name}: ${val||'(cleared)'}`);}
    else render();
  }
  input.addEventListener('keydown',e=>{if(e.key==='Enter')commit();else if(e.key==='Escape'){done=true;render();}});
  input.addEventListener('blur',commit);
}
window.startEditNote=startEditNote;
